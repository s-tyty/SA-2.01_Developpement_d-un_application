<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu de Memory</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" type="module"></script>
</head>

<body>
  <header>
    <h1>Jeu de Memory</h1>
  </header>

  <!-- ========== FORMULAIRE D'ACCUEIL ========== -->
  <div class="setup-form">
    <h2>Démarrer une nouvelle partie</h2>
    <form class="game-form">
      <label for="input-name">Votre pseudo</label>
      <input type="text" id="input-name" placeholder="Entrez votre nom…" maxlength="30" autocomplete="off">

      <label for="input-difficulty">Niveau de difficulté</label>
      <div>
        <select id="input-difficulty">
          <option value="facile">😊 Facile — 8 cartes (2 min)</option>
          <option value="normal" selected>🙂 Normal — 10 cartes (2 min 30)</option>
          <option value="moyen">🤔 Moyen — 12 cartes (3 min)</option>
          <option value="difficile">😈 Difficile — 16 cartes (4 min)</option>
        </select>
      </div>

      <label for="input-collection">Collection d'images</label>
      <div>
        <select id="input-collection">
          <option value="animals">🐾 Animals</option>
          <option value="fruits">🍎 Fruits</option>
          <option value="cars">🏎️ Cars</option>
        </select>
      </div>

      <button id="btn-start" type="submit">Commencer la partie</button>
    </form>

    <!-- Historique des parties (fonctionnalité 4) -->
    <div id="history-section" class="history-section hidden">
      <h3>🏆 Dernières parties</h3>
      <table class="history-table">
        <thead>
          <tr>
            <th>Joueur</th>
            <th>Niveau</th>
            <th>Score</th>
            <th>Paires</th>
            <th>Temps</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ========== ZONE DE JEU ========== -->
  <div class="game-area hidden">
    <!-- En-tête avec chrono + barre de progression (fonctionnalité 6) -->
    <div class="game-area-header"></div>
    <div class="timer-bar-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>
    <div class="game-board"></div>
  </div>

  <!-- ========== MODAL DE FIN DE PARTIE (fonctionnalité 1) ========== -->
  <div id="end-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modal-icon" class="modal-icon"></div>
      <h2 id="modal-title"></h2>
      <div class="modal-stats">
        <div class="stat-item">
          <span class="stat-label">Score</span>
          <span id="modal-score" class="stat-value"></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Paires trouvées</span>
          <span id="modal-pairs" class="stat-value"></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Temps restant</span>
          <span id="modal-time" class="stat-value"></span>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modal-replay" class="btn-primary">🔄 Rejouer</button>
        <button id="modal-menu" class="btn-secondary">🏠 Menu</button>
      </div>
    </div>
  </div>


</body>
</html>
